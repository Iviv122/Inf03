services:
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: db
      MARIADB_DATABASE: db
      MARIADB_USER: db
      MARIADB_PASSWORD: db
    volumes:
      - ./mariadb:/docker-entrypoint-initdb.d
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: db
    ports:
      - 8080:80
  php:
    image: php:latest
    build: .
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    ports:
      - 8000:80